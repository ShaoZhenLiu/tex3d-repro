  batch_size: 8
  learning_rate: 0.05
  epsilon: 0.25098039215686274
  init_std: 0.01
  parameter_bounds: [-5.0, 5.0]
  alpha_feature: 10.0
  alpha_action: 0.0
  lambda_amplitude: 0.1
  lambda_tv: 0.1
  uv_sampling: shared_per_batch_and_cameras
  sampling_stream: full_precision_paired_replay
  checkpoint_updates_completed: [0, 100, 250, 499, 500, 501, 1000, 2000, 3500, 5000]
  final_selection: final_update_not_target_best
  allow_full_multiseed_without_gate_d: false
